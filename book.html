<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery – Ritz Motel Namusera</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="bg-img">
    
  </div>
  
  
  
  <!-- BOOKING FORM -->
<section class="booking-form-section" id="book">
  <div class="sec-head">
    
    <h2>Reserve Your <em>Stay</em></h2>

  </div>
  <div class="bf-card">
    <div class="bf-grid">
      <div class="bf-field">
        <label>Full Name</label>
        <input type="text" id="bfName" placeholder="e.g. John Kato">
      </div>
      <div class="bf-field">
        <label>Phone Number</label>
        <input type="tel" id="bfPhone" placeholder="e.g. 0787 123 456">
      </div>
      <div class="bf-field">
        <label> Room Type</label>
        <select id="bfRoom">
          <option value="">Select a room…</option>
          <option value="Standard Room – UGX 50,000/night">Standard Room – UGX 50,000/night</option>
          <option value="Comfort Room – UGX 60,000/night">Comfort Room – UGX 60,000/night</option>
          <option value="Executive Room – UGX 100,000/night (Breakfast included)">Executive Room – UGX 100,000/night (Breakfast included)</option>
          <option value="Deluxe Suite – UGX 150,000/night (Breakfast included)">Deluxe Suite – UGX 150,000/night (Breakfast included)</option>
        </select>
      </div>
      <div class="bf-field">
        <label>Number of Guests</label>
        <select id="bfGuests">
          <option value="1 guest">1 guest</option>
          <option value="2 guests">2 guests</option>
          <option value="3 guests">3 guests</option>
          <option value="4+ guests">4+ guests</option>
        </select>
      </div>
      <div class="bf-field">
        <label>📅 Check-in Date</label>
        <input type="date" id="bfCheckin">
      </div>
      <div class="bf-field">
        <label>📅 Check-out Date</label>
        <input type="date" id="bfCheckout">
      </div>
      <div class="bf-field">
        <label>📧 Email (optional)</label>
        <input type="email" id="bfEmail" placeholder="e.g. john@gmail.com">
      </div>
    </div>
    <div class="bf-field" style="margin-top:4px;">
      <label>📝 Special Requests (optional)</label>
      <textarea id="bfNotes" placeholder="e.g. early check-in, ground floor room, extra towels…" rows="3"></textarea>
    </div>
    <div class="bf-msg" id="bfMsg"></div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      <button class="bf-submit" style="flex:1;background:#25D366;" onclick="submitBooking('whatsapp')">Book via WhatsApp</button>
      <button class="bf-submit" style="flex:1;background:var(--red);" onclick="submitBooking('pay')"> Pay Now (MTN/Airtel/Visa)</button>
    </div>
    <p class="bf-note"><span style="color:green">WhatsApp:</span> instant confirmation. <span style="color:red"> Pay Now:</span> to immediately secure online payment via Pesapal.</p>
  </div>
</section>
</body>
</html>
